<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    {{- $url := trim .url " " }}
    {{- $is_external := findRE "://" $url }}
    <a class="social-icon-{{ .name }}" href="{{ $url | safeURL }}" {{ if $is_external }}target="_blank" {{ end }}rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{- if eq .name "cv" -}}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.4h8.1L18 7.3v13.3H6z" stroke-width="2.15" />
            <path d="M14 3.6v4h4" stroke-width="2.15" />
            <circle cx="10.2" cy="9.7" r="1.35" stroke-width="2" />
            <path d="M7.9 13.3c.7-1 1.5-1.5 2.3-1.5s1.6.5 2.3 1.5" stroke-width="2" />
            <path d="M8.2 16.2h6.9M8.2 18.7h6.9" stroke-width="2" />
        </svg>
        {{- else if eq .name "orcid" -}}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9.2" stroke-width="2" />
            <text x="12" y="15.2" fill="currentColor" stroke="none" text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="760">ID</text>
        </svg>
        {{- else if eq .name "persona" -}}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.2 5.2h7.6v8.1H8.2z" stroke-width="2" />
            <path d="M8.4 10.2h7.2" stroke-width="2" />
            <path d="M4.8 15.1c2.1 1.1 4.5 1.6 7.2 1.6s5.1-.5 7.2-1.6" stroke-width="2.15" />
        </svg>
        {{- else -}}
        {{ partial "svg.html" . }}
        {{- end -}}
    </a>
    {{- end }}
</div>
