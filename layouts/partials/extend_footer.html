{{/* Render Mermaid diagrams in Markdown code fences. */}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  document.querySelectorAll('pre > code.language-mermaid').forEach((codeBlock) => {
    const diagram = document.createElement('div');
    diagram.className = 'mermaid';
    diagram.textContent = codeBlock.textContent;
    codeBlock.parentElement.replaceWith(diagram);
  });

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: 'strict',
    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default'
  });
</script>

{{- if eq .RelPermalink "/persona/" }}
<script>
  (() => {
    const input = document.getElementById('persona-search-input');
    const entries = Array.from(document.querySelectorAll('.persona-entry'));
    const tags = Array.from(document.querySelectorAll('.persona-tag'));
    const empty = document.getElementById('persona-empty');
    let activeTag = 'all';

    const setActiveTag = (tagName) => {
      activeTag = tagName || 'all';
      tags.forEach((item) => {
        const isActive = item.dataset.tag === activeTag;
        item.classList.toggle('active', isActive);
        item.setAttribute('aria-pressed', String(isActive));
      });
    };

    const filterEntries = () => {
      const query = (input?.value || '').trim().toLowerCase();
      let visibleCount = 0;

      entries.forEach((entry) => {
        const tagMatch = activeTag === 'all' || entry.dataset.tags.split(' ').includes(activeTag);
        const textMatch = !query || entry.textContent.toLowerCase().includes(query) || entry.dataset.text.includes(query);
        const isVisible = tagMatch && textMatch;
        entry.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });

      if (empty) empty.hidden = visibleCount !== 0;
    };

    tags.forEach((tag) => {
      tag.setAttribute('aria-pressed', String(tag.classList.contains('active')));
      tag.addEventListener('click', () => {
        setActiveTag(tag.dataset.tag);
        filterEntries();
      });
    });

    input?.addEventListener('input', filterEntries);
  })();
</script>
{{- end }}
