{{/* Render Mermaid diagrams in Markdown code fences. */}}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

  document.querySelectorAll('pre > code.language-mermaid').forEach((codeBlock) => {
    const diagram = document.createElement('div');
    diagram.className = 'mermaid';
    diagram.textContent = codeBlock.textContent;
    codeBlock.parentElement.replaceWith(diagram);
  });

  mermaid.initialize({
    startOnLoad: true,
    securityLevel: 'strict',
    theme: document.documentElement.dataset.theme === 'dark' ? 'dark' : 'default'
  });
</script>

{{- partial "goatcounter.html" . -}}

<script>
  (() => {
    document.querySelectorAll('.publication-topic-explorer').forEach(() => {
      document.querySelectorAll('.post-content li').forEach((item) => {
        const tagNode = Array.from(item.querySelectorAll('strong')).find((node) => node.textContent.trim().toLowerCase() === 'tags:');
        if (!tagNode) return;

        const tagText = (tagNode.parentElement?.textContent || '').replace(/^Tags:\s*/i, '');
        const tagSlugs = tagText
          .split('·')
          .map((tag) => tag.trim().toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''))
          .filter(Boolean);

        if (tagSlugs.length) {
          item.dataset.topicEntry = '';
          item.dataset.tags = tagSlugs.join(' ');
          item.classList.add('topic-entry', 'publication-entry');
        }
      });
    });

    const entries = Array.from(document.querySelectorAll('[data-topic-entry]'));
    const tags = Array.from(document.querySelectorAll('.topic-filter'));
    if (!entries.length || !tags.length) return;

    const empty = document.querySelector('.topic-empty');
    let activeTag = 'all';

    const setActiveTag = (tagName) => {
      activeTag = tagName || 'all';
      tags.forEach((item) => {
        const isActive = item.dataset.tag === activeTag;
        item.classList.toggle('active', isActive);
        item.setAttribute('aria-pressed', String(isActive));
      });
    };

    const filterEntries = () => {
      let visibleCount = 0;

      entries.forEach((entry) => {
        const entryTags = (entry.dataset.tags || '').split(/\s+/);
        const isVisible = activeTag === 'all' || entryTags.includes(activeTag);
        entry.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });

      if (empty) empty.hidden = visibleCount !== 0;
    };

    tags.forEach((tag) => {
      tag.setAttribute('aria-pressed', String(tag.classList.contains('active')));
      tag.addEventListener('click', () => {
        setActiveTag(tag.dataset.tag);
        filterEntries();
      });
    });
  })();
</script>
