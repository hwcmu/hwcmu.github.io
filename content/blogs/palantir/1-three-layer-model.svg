<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="三层模型：遗留系统、本体、应用与AI">
<style>
text{font-family:Arial,Helvetica,sans-serif;stroke:none}
.t{font-size:14px;fill:#2c2c2a}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
.box{fill:#fff;stroke:#b4b2a9;stroke-width:.5}
.arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
.c-teal,.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th,.c-teal .t{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-purple,.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple .th,.c-purple .t{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-gray,.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th,.c-gray .t{fill:#444441}.c-gray .ts{fill:#5F5E5A}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="430" fill="#ffffff"/>
<g class="c-purple">
<rect x="90" y="48" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="190" y="70" text-anchor="middle" dominant-baseline="central">补贴发放应用</text>
<text class="ts" x="190" y="89" text-anchor="middle" dominant-baseline="central">在档案上直接操作</text>
</g>
<g class="c-purple">
<rect x="390" y="48" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="490" y="70" text-anchor="middle" dominant-baseline="central">AI 决策与审计</text>
<text class="ts" x="490" y="89" text-anchor="middle" dominant-baseline="central">只在真实对象上推理</text>
</g>
<g class="c-teal">
<rect x="60" y="160" width="560" height="130" rx="20" stroke-width="0.5"/>
<text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">本体层 · 一个农民，一个档案</text>
</g>
<rect class="box" x="230" y="205" width="220" height="60" rx="10" stroke-width="1"/>
<text class="th" x="340" y="228" text-anchor="middle" dominant-baseline="central">农民 对象</text>
<text class="ts" x="340" y="248" text-anchor="middle" dominant-baseline="central">统一的现实模型</text>
<line x1="190" y1="158" x2="190" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="158" x2="490" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="135" y1="344" x2="285" y2="294" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="344" x2="340" y2="294" class="arr" marker-end="url(#arrow)"/>
<line x1="545" y1="344" x2="395" y2="294" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="60" y="350" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="371" text-anchor="middle" dominant-baseline="central">财务系统</text>
<text class="ts" x="135" y="390" text-anchor="middle" dominant-baseline="central">付款对象 12345</text>
</g>
<g class="c-gray">
<rect x="265" y="350" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="371" text-anchor="middle" dominant-baseline="central">补贴系统</text>
<text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">申请人 W. Smith</text>
</g>
<g class="c-gray">
<rect x="470" y="350" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="371" text-anchor="middle" dominant-baseline="central">土地系统</text>
<text class="ts" x="545" y="390" text-anchor="middle" dominant-baseline="central">持有人 A-77</text>
</g>
</svg>