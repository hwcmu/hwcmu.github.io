baseURL: "https://hwcmu.github.io/"  # [修改这里] 换成你的GitHub用户名，注意最后有个斜杠
languageCode: "en-us"
title: "Hairong"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  goatCounterCode: "vov"
  title: Hairong
  description: "Data analyst at the University of Pittsburgh and statistician at VA Pittsburgh | Clinical analytics, biostatistics, AI-enabled research workflows, and systems thinking"
  keywords: [Clinical Analytics, Biostatistics, Healthcare Data Science, AI-enabled Research Workflows, Clinical Data, Network Analysis, Trajectory Analysis, Complex Systems, University of Pittsburgh, VA Pittsburgh]
  author: Hairong
  # 默认使用系统主题，但也允许用户切换
  defaultTheme: auto

  label:
    text: Home
  
  # 首页配置
  profileMode:
    enabled: true
    title: "Hi, I'm Hairong"
    subtitle: "Data Analyst at the University of Pittsburgh · Statistician at VA Pittsburgh"
    imageUrl: "/images/avatar.png"
  # 社交链接 (显示在首页底部)
  socialIcons:
    - name: persona
      title: Persona
      url: "/persona/"
    - name: linkedin
      url: "https://www.linkedin.com/in/hairong-wang/"
    - name: cv
      title: CV
      url: "/cv/"
    - name: github
      url: "https://github.com/hwcmu" # [修改这里] 换成你的GitHub用户名
    - name: orcid
      title: ORCID
      url: "https://orcid.org/my-orcid?orcid=0000-0001-6523-1676"
    - name: googlescholar
      title: Google Scholar
      url: "https://scholar.google.com/citations?user=omqwO78AAAAJ&hl=en"

menu:
  main:
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 1
    - identifier: notes
      name: Notes
      url: /blogs/
      weight: 2
    - identifier: papers
      name: Papers
      url: /publications/
      weight: 3

markup:
  goldmark:
    renderer:
      unsafe: true
