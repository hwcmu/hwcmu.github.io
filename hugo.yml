baseURL: "https://hwcmu.github.io/"  # [修改这里] 换成你的GitHub用户名，注意最后有个斜杠
languageCode: "en-us"
title: "Hairong Wang"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Hairong Wang
  description: "Data Analyst at the University of Pittsburgh | Clinical AI, real-world evidence, biostatistics, and reproducible data workflows"
  keywords: [Clinical AI, Real-World Evidence, Biostatistics, Healthcare Data Science, Machine Learning, AI-assisted Analytics, Clinical Workflows, University of Pittsburgh, VA Pittsburgh, CMU, Georgia Tech]
  author: Hairong Wang
  # 默认使用系统主题，但也允许用户切换
  defaultTheme: auto

  label:
    text: Home
  
  # 首页配置
  profileMode:
    enabled: true
    title: "Hi 👋, I'm Hairong Wang"
    subtitle: "Data Analyst at the University of Pittsburgh and Biostatistician at VA Pittsburgh. I build clinical AI, real-world evidence, and reproducible data workflows."
    imageUrl: "/images/avatar.png"
    # buttons:
    #   - name: Resume
    #     url: "/docs/hairong_resume.pdf"
    #   - name: Publications  # 把名字改成 Publications (或者 "论文")
    #     url: /publications  # 把链接改成 /publications
    #   - name: Email Me
    #     url: "mailto:hairongcmu@gmail.com"

  # 社交链接 (显示在首页底部)
  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/hairong-wang/"
    - name: github
      url: "https://github.com/hwcmu" # [修改这里] 换成你的GitHub用户名
    - name: email
      url: "mailto:hairongcmu@gmail.com"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1
    - identifier: notes
      name: Notes
      url: /blogs/
      weight: 2
    - identifier: papers
      name: Papers
      url: /publications/
      weight: 3
    - identifier: about
      name: About
      url: /about/
      weight: 4

markup:
  goldmark:
    renderer:
      unsafe: true
